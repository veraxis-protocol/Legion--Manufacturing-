name: LEGION Manufacturing CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-integrity:
    name: Source integrity (INV-01, WO-A02)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 --version
      - name: Verify every imported file against the manifest
        run: python3 -I tools/upstream_manifest.py verify --evidence evidence/SOURCE_MANIFEST.json && cat evidence/SOURCE_MANIFEST.json

  policy:
    name: License compliance and secret scan (WO-A01)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I tools/repo_policy.py --evidence evidence/LICENSE_REPORT.json && cat evidence/LICENSE_REPORT.json

  protected-repos:
    name: Protected repositories unchanged (INV-09)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I tools/protected_pins.py --evidence evidence/PROTECTED_REPOS.json && cat evidence/PROTECTED_REPOS.json

  upstream-baseline:
    name: Anthropic upstream executable baseline (WO-A03)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 --version
      - name: Run upstream entrypoints on a copy of the import
        run: python3 -I tools/upstream_baseline.py --evidence evidence/UPSTREAM_BASELINE.json && cat evidence/UPSTREAM_BASELINE.json

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p "test_*.py" -v
